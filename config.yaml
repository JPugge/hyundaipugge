version: 1
defaults:
  publish:
    on_change_only: true
    min_interval: 10s
devices:
  - id: ioniq
    name: "Ioniq"
    source: obd
    obd:
      service_uuid: "FFF0"
      tx_char_uuid: "FFF2"
      rx_char_uuid: "FFF1"
      tx_delay: 50ms
      init_commands: ["ATSH7E4"]
    sensors:
      - key: soc_bms
        mode: "21"
        pid: "01"
        update_interval: 30s
        formula: "e/2"
        unit: "%"
